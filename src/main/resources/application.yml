spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payflow}
    username: ${SPRING_DATASOURCE_USERNAME:payflow}
    password: ${SPRING_DATASOURCE_PASSWORD:payflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
payflow:
  gateway:
    outcome: ${PAYFLOW_GATEWAY_OUTCOME:APPROVED}
springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
