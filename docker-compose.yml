services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d payflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - payflow-postgres:/var/lib/postgresql/data
volumes:
  payflow-postgres:
